<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Cigarettes - SmokeBuddy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <header>
        <div class="logo-container">
            <div class="logo">
                <div class="shield">
                    <div class="quadrant q1"></div>
                    <div class="quadrant q2"></div>
                    <div class="quadrant q3"></div>
                    <div class="quadrant q4"></div>
                    <div class="banner"></div>
                </div>
            </div>
            <h1>SmokeBuddy</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li class="active"><a href="buy.html">Buy</a></li>
                <li><a href="sell.html">Deliver</a></li>
            </ul>
        </nav>
    </header>

    <div class="progress-bar">
        <div class="progress-step active">
            <div class="step-number">1</div>
            <div class="step-text">Select Product</div>
        </div>
        <div class="progress-step">
            <div class="step-number">2</div>
            <div class="step-text">Location</div>
        </div>
        <div class="progress-step">
            <div class="step-number">3</div>
            <div class="step-text">Payment</div>
        </div>
        <div class="progress-step">
            <div class="step-number">4</div>
            <div class="step-text">Confirmation</div>
        </div>
    </div>

    <section class="form-section">
        <h2>Select Your Products</h2>
        <form id="product-form">
            <div class="form-group">
                <label for="product">Cigarette Brand:</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select brand</option>
                    <option value="classic">Classic (₹18)</option>
                    <option value="gold_flake">Gold Flake (₹20)</option>
                    <option value="marlboro">Marlboro (₹22)</option>
                    <option value="wills">Wills (₹15)</option>
                    <option value="biri">Biri (₹10)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity:</label>
                <select id="quantity" name="quantity" required>
                    <option value="" disabled selected>Select quantity</option>
                    <option value="1">1 cigarette (Just need a quick break)</option>
                    <option value="2">2 cigarettes (Got a friend)</option>
                    <option value="5">5 cigarettes (Long study session ahead)</option>
                    <option value="10">10 cigarettes (Stocking up)</option>
                    <option value="pack">Full pack (Serious smoker)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="urgency">Urgency Level:</label>
                <select id="urgency" name="urgency" required>
                    <option value="" disabled selected>How urgent is your smoke break?</option>
                    <option value="chill">Whenever (Within an hour)</option>
                    <option value="soon">Soon (Within 30 minutes)</option>
                    <option value="urgent">Urgent! (ASAP - 10 minutes)</option>
                    <option value="emergency">Code Red! (I'm about to lose it)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="extras">Extras:</label>
                <div class="checkbox-group">
                    <label class="checkbox-container">
                        <input type="checkbox" name="extras" value="lighter">
                        <span class="checkbox-text">Need a lighter (+₹5)</span>
                    </label>
                    <label class="checkbox-container">
                        <input type="checkbox" name="extras" value="matches">
                        <span class="checkbox-text">Matches (Free)</span>
                    </label>
                    <label class="checkbox-container">
                        <input type="checkbox" name="extras" value="mints">
                        <span class="checkbox-text">Breath mints (+₹10)</span>
                    </label>
                    <label class="checkbox-container">
                        <input type="checkbox" name="extras" value="deodorant">
                        <span class="checkbox-text">Quick spray of deodorant (+₹5)</span>
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn secondary" onclick="window.location.href='index.html'">Back</button>
                <button type="button" class="btn primary" onclick="window.location.href='location.html'">Next Step</button>
            </div>
        </form>
    </section>

    <footer>
        <p>© 2025 SmokeBuddy - A Fictional Service</p>
        <p class="disclaimer">This is a fictional website created for fun and illustrative purposes only. We do not actually deliver cigarettes or encourage smoking.</p>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
